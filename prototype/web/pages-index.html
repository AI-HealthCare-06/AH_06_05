<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>5팀 복약 안내 프로토타입</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #E8EDF4; }
      #root { display: flex; flex: 1; height: 100%; max-width: 440px; margin: 0 auto; background: #F4F7FB; box-shadow: 0 0 0 1px #CBD5E1, 0 8px 32px rgba(15, 23, 42, 0.12); }
      @media (max-width: 480px) { #root { max-width: none; box-shadow: none; } }
    </style>
  </head>
  <body>
    <noscript>JavaScript를 켜야 프로토타입이 열려요.</noscript>
    <div id="root"></div>
    <script src="js/app.js" defer></script>
  </body>
</html>
