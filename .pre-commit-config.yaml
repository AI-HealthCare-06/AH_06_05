# 커밋 전에 자동으로 도는 검사. 처음 한 번 각자: uv run pre-commit install
# prototype/은 9/30 상태로 두는 회의용 프로토타입이라 검사하지 않음
exclude: ^prototype/

repos:
  # 기본 검사
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # md의 줄 끝 공백 두 칸(줄바꿈)은 지키기
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files   # 공공데이터 원본이나 사진이 실수로 올라가지 않게
        args: [--maxkb=1024]
      - id: detect-private-key        # 비밀키가 들어간 파일 차단

  # 파이썬: CI와 같은 버전 (uv.lock 0.16.10). 고치기를 포맷보다 먼저
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # 앱: TypeScript 타입 검사 (frontend/ 파일이 바뀐 커밋에서만)
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm --prefix frontend run typecheck   # frontend/에서 npm install을 먼저 해야 함
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
